name: Comprobar blog Quarto
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.20'
      - name: Comprobar sintaxis de JavaScript
        run: node --check assets/article-tools.js && node --check assets/filters.js
      - name: Verificar paginación y filtros en DOM simulado
        run: node tests/test_pagination.cjs
      - name: Probar lógica de métricas (sin acceder a Cloudflare)
        run: |
          python3 -m py_compile scripts/update_views.py
          python3 -m unittest discover -s tests -p 'test_views.py' -v
      - name: Probar laboratorio RunCoach AI sin servicios externos
        run: |
          cd posts/runcoach-rag-consultas-contextuales-practica
          python3 -m codigo.demo
          python3 -m unittest discover -s pruebas -v
      - name: Comprobar métricas RAG sobre datos sintéticos
        run: |
          cd posts/evaluar-recuperacion-rag-precision-recall-mrr
          python3 codigo/metricas.py
          python3 -m unittest discover -s pruebas -v
      - name: Comprobar laboratorio de evidencia y abstención SeniorVital
        run: |
          cd posts/seniorvital-evidencia-abstencion-rag-practica
          python3 -m codigo.demo
          python3 -m unittest discover -s pruebas -v
      - name: Verificar generación con borradores ocultos
        run: quarto render
      - name: Comprobar enlaces del sitio publicable
        run: python3 scripts/check_site.py
      - name: Generar vista previa editorial con borradores visibles
        run: quarto render --profile review
      - name: Comprobar enlaces en vista previa
        run: python3 scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: blog-preview
          path: _site/
          retention-days: 7
